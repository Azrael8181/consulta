<style>
:root{--bg:#f4f7fb;--fg:#13202e;--card:#fff;--line:#d3dde8;--acc:#0b5394;--err:#b3261e}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 16px;opacity:.85}
input[type=password]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;font:inherit}
label.r{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:14px}
button{margin-top:16px;width:100%;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
#e{color:var(--err);min-height:1.5em;margin-top:10px;font-size:14px}
</style>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='consulta_chiave_'+D.salt.slice(0,8);
async function apri(raw){
  const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.iv)},key,ub(D.ct));
  const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(new Uint8Array(pt));w.close();
  const html=await new Response(ds.readable).text();
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(D.salt),iterations:D.iter,hash:'SHA-256'},base,256));
}
(async()=>{let k=null;try{k=localStorage.getItem(KEY)}catch(e){}
  if(k){try{await apri(ub(k));return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}})();
document.getElementById('fm').onsubmit=async ev=>{ev.preventDefault();
  const bt=document.getElementById('bt'),er=document.getElementById('e');bt.disabled=true;er.textContent='Verifica in corso…';
  try{const raw=await derive(document.getElementById('pw').value);
    try{await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.iv)},await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']),ub(D.ct))}catch(e){er.textContent='Password errata.';bt.disabled=false;return}
    if(document.getElementById('rc').checked){try{let s='';raw.forEach(b=>s+=String.fromCharCode(b));localStorage.setItem(KEY,btoa(s))}catch(e){}}
    await apri(raw);
  }catch(e){er.textContent='Errore: '+(e.message||e);bt.disabled=false}};
</script>
